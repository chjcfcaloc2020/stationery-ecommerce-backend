spring:
  application:
    name: stationery-ecommerce

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

jwt:
  secret: ${SECRET_KEY}
  expiration: ${EXPIRATION_TIME}
  refresh-token-duration: ${REFRESH_TOKEN_DURATION}

cloudinary:
  cloud-name: ${CLOUD_NAME}
  api-key: ${API_KEY_CLOUDINARY}
  api-secret: ${API_SECRET_CLOUDINARY}